[package]
name = "den"
version = "0.23.0"
description = "Den, the desktop front end for the kikedealba tools"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
notify-debouncer-full = "0.7"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
rust_xlsxwriter = "0.99.1"
jiff = "0.2"
portable-pty = "0.9"
tauri-plugin-dialog = "2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"
webkit2gtk = "2"

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
csv = "1"
zip = { version = "8.3", default-features = false, features = ["deflate"] }
