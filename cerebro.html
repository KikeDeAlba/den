<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerebro · Den</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/cerebro.css" />
  </head>
  <body>
    <div id="cerebro">
      <header class="brain-head" data-tauri-drag-region>
        <span class="brain-mark" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="3.6" cy="4.2" r="1.6" />
            <circle cx="12.2" cy="3.4" r="1.4" />
            <circle cx="8.4" cy="8.6" r="1.9" />
            <circle cx="3.8" cy="12.6" r="1.4" />
            <circle cx="12.6" cy="12.4" r="1.6" />
            <path d="M5 5.1l1.9 2.1M10.9 4.3l-1.5 2.6M7.1 10l-2.2 1.6M9.8 9.9l1.7 1.3" />
          </svg>
        </span>
        <span class="brain-wordmark" data-tauri-drag-region>Cerebro</span>
        <label class="brain-select">
          <span class="brain-visually-hidden">Proyecto</span>
          <select id="brain-project"></select>
        </label>
        <div class="brain-search" id="brain-search-box">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.4" />
            <path d="M10.4 10.4 14 14" />
          </svg>
          <input id="brain-search" type="search" placeholder="Buscar en el cerebro" autocomplete="off" spellcheck="false" aria-label="Buscar en el cerebro" aria-controls="brain-hits" aria-expanded="false" />
          <div id="brain-hits" class="brain-hits" role="listbox" hidden></div>
        </div>
        <span class="brain-count" id="brain-count" data-tauri-drag-region></span>
      </header>
      <div class="brain-body">
        <div class="brain-stage" id="brain-stage"></div>
        <div class="brain-legend" id="brain-legend"></div>
        <div class="brain-message" id="brain-message" hidden></div>
        <aside class="brain-side" id="brain-side" aria-label="Detalle del nodo" hidden></aside>
      </div>
    </div>
    <script type="module" src="/src/cerebro.ts"></script>
  </body>
</html>
